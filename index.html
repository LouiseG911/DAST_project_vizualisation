<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titre de la page</title>
    <link rel="stylesheet" href="index.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
  </head>
  <body>
    <div class="page-shell">
      <header id="titre" class="page-header">
        <p>Le Charme, une espèce ...</p>
      </header>

      <div id="textes_presentation" class="page-intro">
        <p>Présentation de l'espèce</p>
        <p>Présentation des données</p>
      </div>

      <main class="content-grid">
        <section class="panel panel-graphs">
          <div id="cartes_densite" class="cards-grid">
            <div id="carte-1" class="graph-card">
              <iframe
                src="CARTES_HTML/density_plot_dep.html"
                title="Carte de densité par département"
                loading="lazy">
              </iframe>
            </div>

            <div id="carte-2" class="graph-card">
              <iframe
                src="CARTES_HTML/density_plot_ser.html"
                title="Carte de densité par sylvoécorégion"
                loading="lazy">
              </iframe>
            </div>
          </div>
        </section>

        <section id="reponses_modele" class="panel problem-panel">
          <h2>Problématique</h2>
          <p>"..."</p>

          <div class="png-grid">
            <div id="reponse_model1" class="png-card">
              <img src="GRAPH_PNG/response_model1.png" title="Réponse du modèle 1" alt="Réponse du modèle 1">
            </div>
            <div id="reponse_model2" class="png-card">
              <img src="GRAPH_PNG/response_model2.png" title="Réponse du modèle 2" alt="Réponse du modèle 2">
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
